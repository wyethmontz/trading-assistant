name: Gold Signal Bot

on:
  workflow_dispatch:  # triggered hourly by cron-job.org

permissions:
  contents: write  # needed to commit the updated signal log back to the repo

jobs:
  send-signal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNT_BALANCE: ${{ secrets.ACCOUNT_BALANCE }}
          RISK_PCT: ${{ secrets.RISK_PCT }}
          ONLY_SEND_BUY: ${{ vars.ONLY_SEND_BUY || secrets.ONLY_SEND_BUY || 'true' }}
          CONFIDENCE_FLOOR: ${{ vars.CONFIDENCE_FLOOR || '65' }}
          ENTRY_BUFFER_USD: ${{ vars.ENTRY_BUFFER_USD || '0' }}
          SELL_TAKE_PROFIT_BUFFER_USD: ${{ vars.SELL_TAKE_PROFIT_BUFFER_USD || '30' }}
          ECONOMIC_CALENDAR_CHECK: ${{ vars.ECONOMIC_CALENDAR_CHECK || 'true' }}
          NEWS_BLACKOUT_BEFORE_MINUTES: ${{ vars.NEWS_BLACKOUT_BEFORE_MINUTES || '120' }}
          NEWS_BLACKOUT_AFTER_MINUTES: ${{ vars.NEWS_BLACKOUT_AFTER_MINUTES || '60' }}
        run: python run_bot.py

      - name: Persist signal log
        run: |
          git config user.name "gold-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/signal_log.csv
          git diff --cached --quiet || git commit -m "chore: update signal log"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto latest main and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push signal log after retries." >&2
          exit 1
