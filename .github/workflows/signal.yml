name: Gold Signal Bot

on:
  workflow_dispatch:  # triggered hourly by cron-job.org

permissions:
  contents: write  # needed to commit the updated signal log back to the repo

jobs:
  send-signal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNT_BALANCE: ${{ secrets.ACCOUNT_BALANCE }}
          RISK_PCT: ${{ secrets.RISK_PCT }}
          ONLY_SEND_BUY: ${{ vars.ONLY_SEND_BUY || secrets.ONLY_SEND_BUY }}
          INCLUDE_WAIT_SIGNALS: ${{ vars.INCLUDE_WAIT_SIGNALS || secrets.INCLUDE_WAIT_SIGNALS }}
        run: python run_bot.py

      - name: Persist signal log
        run: |
          git config user.name "gold-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/signal_log.csv
          git diff --cached --quiet || git commit -m "chore: update signal log"
          git push
